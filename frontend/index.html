<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Call Detector</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <div class="shield">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3L4.5 6v5.5c0 4.7 3.1 8.7 7.5 10.5 4.4-1.8 7.5-5.8 7.5-10.5V6L12 3z"/>
                <path d="M8.5 12l2.2 2.2 4.8-5"/>
            </svg>
        </div>
        <h1>Spam Call Detector</h1>
        <p>AI-powered call security simulation</p>
    </header>

    <!-- ANALYSIS AREA -->
    <main id="analysisArea" class="hidden">

        <div class="call-info">
            <span>📞 Active Call</span>
            <strong id="activeNumber"></strong>
        </div>

        <div class="input-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="text"
                id="phone"
                placeholder="+919999999999"
            >

        </div>


        <div class="input-group">

            <label for="conversation">
                Conversation
            </label>

            <textarea
                id="conversation"
                placeholder="Enter what the caller is saying..."
            ></textarea>

        </div>


        <div class="input-group">

            <label for="language">
                Language
            </label>

            <select id="language">

                <option value="en">
                    English
                </option>

                <option value="hi">
                    Hindi / Hinglish
                </option>

            </select>

        </div>


        <button id="analyzeBtn">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="11" cy="11" r="7"/>
    <path d="M16 16l5 5"/>
</svg>
Analyze Call
        </button>

<button id="showFlaggedBtn" class="flagged-btn">
     Show Flagged Numbers
</button>

<div id="flaggedNumbers" class="flagged-numbers hidden"></div>


        <!-- RESULT -->

        <div id="result" class="result hidden">

            <div id="resultIcon"></div>

            <h2 id="classification"></h2>

            <div class="result-details">

                <div>
                    <span>Confidence</span>
                    <strong id="confidence"></strong>
                </div>

                <div>
    <span>Reason</span>
    <strong id="reason"></strong>
</div>

<div id="detailsBox">
    <span>Analysis</span>
    <strong id="details"></strong>
</div>

                <div id="reportsBox">
                    <span>Reports</span>
                    <strong id="reports"></strong>
                </div>

            </div>

        </div>

    </main>

    <footer>
        <span>AI Call Security</span>
        <span>•</span>
        <span>ML Powered</span>
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
